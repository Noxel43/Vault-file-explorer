[package]
name = "vault"
version = "0.1.0"
description = "Vault - a fast, modular file explorer"
authors = ["Noxel43"]
license = "MIT"
repository = "https://github.com/Noxel43/Vault-file-explorer"
edition = "2024"

# Installation tiers. A tier controls which modules are *installed* (compiled in);
# installed modules can still be toggled on/off at runtime in Settings.
# Build a specific tier with e.g. `pnpm tauri build -- --no-default-features --features tier-lite`.
[features]
default = ["tier-full"]
tier-lite = []
tier-standard = ["tier-lite"]
tier-full = ["tier-standard"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
trash = "5.2.9"
notify = "8.2.1"
dunce = "1.0.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
